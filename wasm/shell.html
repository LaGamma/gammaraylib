<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="darkreader-lock">
  <title>{{TITLE}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #canvas {
      display: block;
      outline: none;
    }
    #status {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #cfe8ff;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 12px;
      border-radius: 6px;
      pointer-events: none;
    }
    #fullscreen-btn {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 20;
      background: rgba(14, 38, 68, 0.78);
      color: #e6f4ff;
      border: 1px solid rgba(130, 195, 255, 0.45);
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    #fullscreen-btn:hover {
      background: rgba(24, 64, 112, 0.92);
      border-color: rgba(175, 220, 255, 0.8);
    }
    #fullscreen-btn:active {
      transform: scale(0.96);
    }
    #grl-touch-overlay {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    @media (hover: none) and (pointer: coarse), (pointer: coarse) {
      #grl-touch-overlay { display: block; }
      #fullscreen-btn {
        top: 14px;
        left: 14px;
        bottom: auto;
        right: auto;
      }
    }
    body.grl-show-touch #grl-touch-overlay {
      display: block;
    }
    body.grl-show-touch #fullscreen-btn {
      top: 14px;
      left: 14px;
      bottom: auto;
      right: auto;
    }
    .grl-dpad {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 156px;
      height: 156px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      pointer-events: auto;
      touch-action: none;
    }
    .grl-actions {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 156px;
      height: 120px;
      pointer-events: none;
    }
    .grl-btn {
      background: rgba(14, 38, 68, 0.78);
      border: 2px solid rgba(150, 215, 255, 0.45);
      border-radius: 14px;
      color: #e6f4ff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
    }
    .grl-action-btn {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      font-size: 18px;
    }
    .grl-action-btn[data-btn="b"] {
      bottom: 0;
      left: 0;
    }
    .grl-action-btn[data-btn="a"] {
      top: 0;
      right: 0;
    }
    .grl-pause-btn {
      position: fixed;
      top: 14px;
      right: 14px;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 8px;
      pointer-events: auto;
    }
    .grl-btn.active {
      background: rgba(65, 155, 235, 0.85);
      border-color: #ffffff;
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="status">Loading {{TITLE}}...</div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <button id="fullscreen-btn" type="button" title="Toggle Fullscreen">⛶ Fullscreen</button>
  <div id="grl-touch-overlay" aria-hidden="true">
    <div class="grl-dpad">
      <div></div>
      <div class="grl-btn" data-btn="up">▲</div>
      <div></div>
      <div class="grl-btn" data-btn="left">◀</div>
      <div></div>
      <div class="grl-btn" data-btn="right">▶</div>
      <div></div>
      <div class="grl-btn" data-btn="down">▼</div>
      <div></div>
    </div>
    <div class="grl-actions">
      <div class="grl-btn grl-action-btn" data-btn="b">B</div>
      <div class="grl-btn grl-action-btn" data-btn="a">A</div>
    </div>
    <div class="grl-btn grl-pause-btn" data-btn="pause">❚❚</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const canvasEl = document.getElementById('canvas');
    const fsBtn = document.getElementById('fullscreen-btn');

    function toggleFullscreen() {
      const doc = document;
      const root = doc.documentElement;
      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
        if (root.requestFullscreen) {
          root.requestFullscreen().catch(() => {});
        } else if (root.webkitRequestFullscreen) {
          root.webkitRequestFullscreen();
        }
      } else {
        if (doc.exitFullscreen) {
          doc.exitFullscreen().catch(() => {});
        } else if (doc.webkitExitFullscreen) {
          doc.webkitExitFullscreen();
        }
      }
      canvasEl.focus();
    }

    fsBtn.addEventListener('click', toggleFullscreen);

    window._virtualKeys = window._virtualKeys || {};
    window.gammaraylib = {
      touchConfig: {
        enabled: true,
        keys: {
          up: Array.of(87, 265),     // W + Up Arrow
          down: Array.of(83, 264),   // S + Down Arrow
          left: Array.of(65, 263),   // A + Left Arrow
          right: Array.of(68, 262),  // D + Right Arrow
          a: Array.of(32, 257),      // Space + Enter
          b: Array.of(340),          // Left Shift
          pause: Array.of(80),       // P
        },
        labels: { a: 'A', b: 'B', pause: '❚❚' },
      },
      setKey(keyCode, isDown) {
        const k = Number(keyCode);
        Reflect.set(window._virtualKeys, k, isDown ? 1 : 0);
        if (window._wasmKeyBufPtr !== undefined && typeof HEAPU8 !== 'undefined') {
          HEAPU8[Number(window._wasmKeyBufPtr) + k] = isDown ? 1 : 0;
        }
      },
      clearKeys() {
        window._virtualKeys = {};
        if (window._wasmKeyBufPtr !== undefined && typeof HEAPU8 !== 'undefined') {
          const base = Number(window._wasmKeyBufPtr);
          for (let i = 0; i < 512; i++) HEAPU8[base + i] = 0;
        }
      },
      configureTouch(opts) {
        if (!opts) return;
        if (opts.enabled === false) {
          document.getElementById('grl-touch-overlay').style.display = 'none';
          return;
        }
        if (opts.keys) Object.assign(this.touchConfig.keys, opts.keys);
        if (opts.labels) {
          Object.assign(this.touchConfig.labels, opts.labels);
          for (const [btnName, text] of Object.entries(opts.labels)) {
            const el = document.querySelector(`#grl-touch-overlay [data-btn="${btnName}"]`);
            if (el) el.textContent = text;
          }
        }
      },
    };

    // --- Continuous-Slide D-Pad (Touch & Mouse Drag) ---
    const dpadEl = document.querySelector('#grl-touch-overlay .grl-dpad');
    const dpadDirs = Array.of('up', 'down', 'left', 'right');
    let activeDpadTouchId = null;
    let dpadMouseDown = false;

    function updateDpadFromPoint(clientX, clientY) {
      const rect = dpadEl.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.5;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const deadzone = rect.width * 0.14;

      const pressed = new Set();
      if (Math.hypot(dx, dy) > deadzone) {
        if (dy < -deadzone * 0.7) pressed.add('up');
        if (dy > deadzone * 0.7) pressed.add('down');
        if (dx < -deadzone * 0.7) pressed.add('left');
        if (dx > deadzone * 0.7) pressed.add('right');
      }

      for (const dir of dpadDirs) {
        const isDown = pressed.has(dir);
        const btn = dpadEl.querySelector(`.grl-btn[data-btn="${dir}"]`);
        if (btn) btn.classList.toggle('active', isDown);
        const codes = Reflect.get(window.gammaraylib.touchConfig.keys, dir) || Array.of();
        for (const k of codes) window.gammaraylib.setKey(k, isDown);
      }
    }

    function releaseDpad() {
      activeDpadTouchId = null;
      dpadMouseDown = false;
      for (const dir of dpadDirs) {
        const btn = dpadEl.querySelector(`.grl-btn[data-btn="${dir}"]`);
        if (btn) btn.classList.remove('active');
        const codes = Reflect.get(window.gammaraylib.touchConfig.keys, dir) || Array.of();
        for (const k of codes) window.gammaraylib.setKey(k, false);
      }
    }

    dpadEl.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (activeDpadTouchId === null && e.changedTouches.length > 0) {
        const t = e.changedTouches.item(0);
        activeDpadTouchId = t.identifier;
        updateDpadFromPoint(t.clientX, t.clientY);
      }
    }, { passive: false });

    dpadEl.addEventListener('touchmove', (e) => {
      e.preventDefault();
      e.stopPropagation();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches.item(i);
        if (t && t.identifier === activeDpadTouchId) {
          updateDpadFromPoint(t.clientX, t.clientY);
          break;
        }
      }
    }, { passive: false });

    const onDpadTouchEnd = (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches.item(i);
        if (t && t.identifier === activeDpadTouchId) {
          releaseDpad();
          break;
        }
      }
    };
    dpadEl.addEventListener('touchend', onDpadTouchEnd, { passive: false });
    dpadEl.addEventListener('touchcancel', onDpadTouchEnd, { passive: false });

    dpadEl.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dpadMouseDown = true;
      updateDpadFromPoint(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => {
      if (dpadMouseDown) updateDpadFromPoint(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => {
      if (dpadMouseDown) releaseDpad();
    });

    // --- Action & Pause Buttons ---
    document.querySelectorAll('#grl-touch-overlay .grl-action-btn, #grl-touch-overlay .grl-pause-btn').forEach((btn) => {
      const name = btn.getAttribute('data-btn');
      const setPressed = (down, e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        const codes = Reflect.get(window.gammaraylib.touchConfig.keys, name) || Array.of();
        for (const k of codes) window.gammaraylib.setKey(k, down);
        btn.classList.toggle('active', down);
      };
      btn.addEventListener('touchstart', (e) => setPressed(true, e), { passive: false });
      btn.addEventListener('touchend', (e) => setPressed(false, e), { passive: false });
      btn.addEventListener('touchcancel', (e) => setPressed(false, e), { passive: false });
      btn.addEventListener('mousedown', (e) => setPressed(true, e));
      btn.addEventListener('mouseup', (e) => setPressed(false, e));
      btn.addEventListener('mouseleave', () => setPressed(false, null));
    });

    // --- Right Shift (344) & Right Control (345) Desktop Bridge ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ShiftRight') {
        window.gammaraylib.setKey(344, true);
        e.stopImmediatePropagation();
      } else if (e.code === 'ControlRight') {
        window.gammaraylib.setKey(345, true);
        e.stopImmediatePropagation();
      }
    }, true);
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ShiftRight') {
        window.gammaraylib.setKey(344, false);
        e.stopImmediatePropagation();
      } else if (e.code === 'ControlRight') {
        window.gammaraylib.setKey(345, false);
        e.stopImmediatePropagation();
      }
    }, true);

    if (new URLSearchParams(window.location.search).get('touch') === '1' || navigator.maxTouchPoints > 0) {
      document.body.classList.add('grl-show-touch');
    }

    window.addEventListener('blur', () => {
      releaseDpad();
      window.gammaraylib.clearKeys();
    });

    window._decodedPngs = window._decodedPngs || {};

    function decodeImageToTex(path, url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = img.width;
          c.height = img.height;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const rgba = ctx.getImageData(0, 0, img.width, img.height).data;
          Reflect.set(window._decodedPngs, path, {
            width: img.width,
            height: img.height,
            rgba: new Uint8Array(rgba.buffer),
          });
          resolve();
        };
        img.onerror = () => {
          console.warn('[Texture Preload] Failed to decode:', path);
          resolve();
        };
        img.src = url;
      });
    }

    function fitCanvas() {
      const margin = 32;
      const availW = Math.max(100, window.innerWidth - margin);
      const availH = Math.max(100, window.innerHeight - margin);
      const aspect = (canvasEl.width || 800) / (canvasEl.height || 600);

      let targetW = availW;
      let targetH = targetW / aspect;
      if (targetH > availH) {
        targetH = availH;
        targetW = targetH * aspect;
      }
      canvasEl.style.setProperty('width', `${Math.floor(targetW)}px`, 'important');
      canvasEl.style.setProperty('height', `${Math.floor(targetH)}px`, 'important');
    }

    window.addEventListener('resize', fitCanvas);
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
      fitCanvas();
      canvasEl.focus();
    });

    var Module = {
      canvas: canvasEl,
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      setStatus: function(text) {
        if (!text) {
          statusEl.style.display = 'none';
        } else {
          statusEl.textContent = text;
          statusEl.style.display = 'block';
        }
      },
      monitorRunDependencies: function(left) {
        if (left === 0) {
          statusEl.style.display = 'none';
        } else {
          statusEl.textContent = `Loading assets (${left} remaining)...`;
        }
      },
      onRuntimeInitialized: function() {
        const tasks = [];
        function walk(dir) {
          let entries;
          try { entries = FS.readdir(dir); } catch (_) { return; }
          for (const name of entries) {
            if (name === '.' || name === '..') continue;
            const full = (dir === '/' ? '' : dir) + '/' + name;
            const stat = FS.stat(full);
            if (FS.isDir(stat.mode)) {
              walk(full);
            } else if (name.toLowerCase().endsWith('.png')) {
              const bytes = FS.readFile(full);
              const blob = new Blob([bytes], { type: 'image/png' });
              const url = URL.createObjectURL(blob);
              const relPath = full.startsWith('/') ? full.slice(1) : full;
              tasks.push(
                decodeImageToTex(relPath, url).finally(() => URL.revokeObjectURL(url))
              );
            }
          }
        }
        walk('/assets');

        Promise.all(tasks).then(() => {
          statusEl.style.display = 'none';
          canvasEl.focus();
          Module.callMain();
          fitCanvas();
        });
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
